name: Update news

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, deleted]

permissions:
  contents: write
  issues: read

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[ชุมชน]')
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests googlenewsdecoder
      - run: python scripts/fetch_news.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/build_pages.py
      - name: Commit news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A news.json n
          git diff --cached --quiet && exit 0
          git commit -m "Update news.json"
          git pull --rebase origin main
          git push
      - name: Post to Facebook Page
        run: python scripts/post_facebook.py
        continue-on-error: true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      - name: Remember what was posted
        run: |
          [ -f posted.json ] || exit 0
          git add posted.json
          git diff --cached --quiet && exit 0
          git commit -m "Update posted.json"
          git pull --rebase origin main
          git push
